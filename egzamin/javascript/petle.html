<html lang="en">

<body>
    <script> 
   <p id="wypisz"></p>
  var wypisz=document.getElementById("wypisz");
   wypisz.innerHTML="Zadanie 1";
   wypisz.innerHTML+="<br>";
   wypisz.innerHTML+="<br>";
  for(let i = 1; i < 10; i++)
  {
    wypisz.innerHTML += i + "<br>";
  }
 
 
 wypisz.innerHTML+="<br>";
 wypisz.innerHTML+="Zadanie 2";
 wypisz.innerHTML+="<br>";
 wypisz.innerHTML+="<br>";
   for(let i = 10; i >= 1 ; i--)
  {
    wypisz.innerHTML+= i + "<br>" ;
  }
 
  wypisz.innerHTML+="<br>";
  wypisz.innerHTML+="Zadanie 3";
  wypisz.innerHTML+="<br>";
  wypisz.innerHTML+="<br>";
 
  </script>  
    
</body>
