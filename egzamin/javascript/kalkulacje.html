<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

 <h2>Oblicz, ile litrów musisz zatankować</h2>
 <label for="dystans">dystans do przejechania w km:</label><br>
 <input type="number" name="dystans" id="dystans"><br>
 <label for="spalanie">spalanie samochodu w l/100km:</label><br>
 <input type="number" name="spalanie" id="spalanie"><br>
 <button type="submit" onclick="Oblicz()">OBLICZ</button>

 <p id="wynik"></p>

 <script>
    function Oblicz()
    {
      
      var dystans = document.getElementById('dystans').value;
      var spalanie = document.getElementById('spalanie').value;
      var wynik = dystans / 100 * spalanie;
      wypisz=document.getElementById("wynik");
      wypisz.innerHTML = 'Potrzebujesz: ' + wynik + ' litrów paliwa';
     

    }









 </script>


    
</body>
</html>
